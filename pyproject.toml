[project]
name = "excel-to-aasx"
version = "0.1.0"
description = "Convert vendor Excel property sheets into AASX packages (AAS metamodel V3.1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aas-core3.1>=1.0,<2",
    "defusedxml>=0.7,<1",
    "openpyxl>=3.1,<4",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.18",
    "uvicorn>=0.32,<1",
]

[project.scripts]
excel-to-aasx = "excel_to_aasx.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "types-defusedxml>=0.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests run fixed commands (docker, pdftotext) to check the real tools.
"tests/**" = ["S603", "S607"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.hatch.build.targets.wheel]
packages = ["src/excel_to_aasx"]
artifacts = [
    "src/excel_to_aasx/adapters/pdf/extensions/*.rb",
    "src/excel_to_aasx/adapters/templates/**/*",
    "src/excel_to_aasx/adapters/web/static/**/*",
]
